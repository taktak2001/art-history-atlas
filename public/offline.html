<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>オフライン｜美術史アトラス</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, sans-serif;
        background: #f6f4ef; color: #1c1c1e; padding: 2rem;
      }
      @media (prefers-color-scheme: dark) { body { background: #161618; color: #eae7e0; } }
      main { max-width: 32rem; text-align: center; }
      h1 { font-family: "Hiragino Mincho ProN", "YuMincho", Georgia, serif; font-size: 1.6rem; }
      p { line-height: 1.8; color: #5c5c60; }
      @media (prefers-color-scheme: dark) { p { color: #a8a6a0; } }
      a { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem;
          border: 1px solid currentColor; border-radius: 2px; color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>オフラインです</h1>
      <p>
        現在ネットワークに接続できません。以前に閲覧したページはオフラインでも表示できます。
        接続が回復したら再度お試しください。
      </p>
      <a href="/">ホームへ戻る</a>
    </main>
  </body>
</html>

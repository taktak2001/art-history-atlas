name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN に Pages デプロイ権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新のみ（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 検証とビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: データ検証
        run: npm run validate:data

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 単体テスト
        run: npm test

      - name: 静的エクスポートのビルド
        run: npm run build

      # 事前に Settings → Pages → Source を「GitHub Actions」に設定しておくこと
      # （Pages サイトの作成は GITHUB_TOKEN の権限では行えないため、初回のみ手動）。
      - name: Pages の設定
        uses: actions/configure-pages@v5

      - name: 成果物（out/）のアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Pages へデプロイ
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
